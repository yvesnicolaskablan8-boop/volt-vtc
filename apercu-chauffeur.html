<!DOCTYPE html><html><head><meta charset="utf-8"><title>Aperçu — Nouvelle app chauffeur</title>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
 body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#1e293b;padding:24px;}
 h1{color:#fff;font-size:1.3rem;margin:0 0 6px}
 p.sub{color:#94a3b8;margin:0 0 20px;font-size:0.95rem}
 .row{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
 .col{display:flex;flex-direction:column;gap:8px}
 .tag{color:#e2e8f0;font-weight:700;font-size:0.9rem;text-align:center}
 .phone{width:375px;background:#f8fafc;border-radius:28px;padding:16px 14px 90px;--text-primary:#0f172a;--text-secondary:#475569;--glass-border:rgba(15,23,42,0.12);--bg-card:#fff;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.4);min-height:640px}
 .bnav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;border-radius:0 0 28px 28px;display:flex;padding:10px 6px 16px}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#94a3b8;font-size:0.72rem;font-weight:700}
 .bnav a.on{color:#2563eb}
 .bnav iconify-icon{font-size:1.5rem}
</style></head><body>
<h1>📱 Nouvelle application chauffeur</h1>
<p class="sub">Trois écrans : avant paiement · après paiement · « Autres services ». La couleur parle avant le texte.</p>
<div class="row">
<div class="col"><div class="tag">1 — Il doit payer</div><div class="phone" id="p1"></div></div>
<div class="col"><div class="tag">2 — Il a payé</div><div class="phone" id="p2"></div></div>
<div class="col"><div class="tag">3 — Onglet « Autres »</div><div class="phone" id="p3"></div></div>
</div>
<script>
const bnav=(active)=>`<div class="bnav">
  <a class="${active==='accueil'?'on':''}"><iconify-icon icon="solar:home-2-bold"></iconify-icon>Accueil</a>
  <a class="${active==='payer'?'on':''}"><iconify-icon icon="solar:wallet-money-bold"></iconify-icon>Payer</a>
  <a><iconify-icon icon="solar:chat-round-dots-bold"></iconify-icon>Messages</a>
  <a class="${active==='plus'?'on':''}"><iconify-icon icon="solar:widget-4-bold"></iconify-icon>Autres</a>
</div>`;
const tuile=(icon,label,chipBg,iconColor,badge=0)=>`
  <button style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:118px;padding:1rem 0.5rem;border-radius:1.25rem;border:1px solid var(--glass-border);background:#fff;color:var(--text-primary);cursor:pointer;font-family:inherit;box-shadow:0 2px 10px rgba(15,23,42,0.06)">
    ${badge>0?`<span style="position:absolute;top:10px;right:10px;min-width:26px;height:26px;border-radius:13px;background:#b91c1c;color:#fff;font-size:0.85rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 6px">${badge}</span>`:''}
    <span style="width:58px;height:58px;border-radius:16px;background:${chipBg};display:flex;align-items:center;justify-content:center"><iconify-icon icon="${icon}" style="font-size:2rem;color:${iconColor}"></iconify-icon></span>
    <span style="font-size:1.02rem;font-weight:800">${label}</span>
  </button>`;
const tuiles=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
  ${tuile('solar:calendar-date-bold-duotone','Planning','#eff6ff','#1e40af')}
  ${tuile('solar:chat-round-dots-bold-duotone','Messages','#eff6ff','#1e40af')}
  ${tuile('solar:hand-money-bold-duotone','Mes dettes','#fef3c7','#b45309',2)}
  ${tuile('solar:danger-triangle-bold-duotone','Un problème ?','#fee2e2','#b91c1c')}
</div>
<button style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:1.25rem;border:2px solid var(--glass-border);background:transparent;color:var(--text-primary);font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit">
  <iconify-icon icon="solar:widget-4-bold-duotone" style="font-size:1.5rem"></iconify-icon> Autres services
</button>`;
const serviceCard=`<div style="border-radius:1.25rem;background:white;border:1px solid #e2e8f0;padding:1.25rem;margin-bottom:1rem">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><iconify-icon icon="solar:play-circle-bold-duotone" style="font-size:1.3rem;color:#22c55e"></iconify-icon><span style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#64748b">Mon service</span></div>
  <button style="width:100%;padding:16px;border-radius:1rem;border:none;background:linear-gradient(135deg,#22c55e,#16a34a);color:white;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(34,197,94,0.3)"><iconify-icon icon="solar:play-bold" style="margin-right:6px"></iconify-icon> Commencer mon service</button>
</div>`;
document.getElementById('p1').innerHTML=`
<div style="font-size:1.15rem;font-weight:800;color:var(--text-primary);margin:2px 0 10px">Bonjour Landry 👋</div>
<div style="border-radius:1.5rem;background:linear-gradient(150deg,#172554,#1e3a8a);padding:1.5rem 1.25rem;color:white;margin-bottom:1rem;box-shadow:0 8px 28px rgba(30,58,138,0.35);text-align:center">
  <div style="font-size:1.05rem;font-weight:800;opacity:0.95;display:flex;align-items:center;justify-content:center;gap:8px"><iconify-icon icon="solar:wallet-money-bold-duotone" style="font-size:1.5rem"></iconify-icon> À PAYER AUJOURD'HUI</div>
  <div style="font-size:3rem;font-weight:900;margin:10px 0 2px;line-height:1">50 000</div>
  <div style="font-size:1.1rem;font-weight:800;opacity:0.9;margin-bottom:16px">FCFA</div>
  <button style="width:100%;min-height:74px;border-radius:1.25rem;border:none;background:#15803d;color:white;font-size:1.5rem;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;gap:12px"><iconify-icon icon="solar:hand-money-bold-duotone" style="font-size:2rem"></iconify-icon> PAYER</button>
</div>
${tuiles}${bnav('accueil')}`;
document.getElementById('p2').innerHTML=`
<div style="font-size:1.15rem;font-weight:800;color:var(--text-primary);margin:2px 0 10px">Bonjour Landry 👋</div>
<div style="border-radius:1.5rem;background:linear-gradient(150deg,#14532d,#166534);padding:1.75rem 1.25rem;color:white;margin-bottom:1rem;box-shadow:0 8px 28px rgba(22,101,52,0.3);text-align:center">
  <div style="width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;margin:0 auto 12px"><iconify-icon icon="solar:check-circle-bold" style="font-size:3rem"></iconify-icon></div>
  <div style="font-size:1.5rem;font-weight:900">C'est payé !</div>
  <div style="font-size:1rem;font-weight:700;opacity:0.9;margin-top:6px">50 000 FCFA versés aujourd'hui</div>
</div>
${tuiles}${bnav('accueil')}`;
const ligne=(icon,chipBg,iconColor,label,sub)=>`
  <button style="width:100%;display:flex;align-items:center;gap:16px;min-height:70px;padding:12px 16px;border-radius:1.25rem;border:1px solid var(--glass-border);background:var(--bg-card);cursor:pointer;font-family:inherit;margin-bottom:10px;text-align:left">
    <div style="width:52px;height:52px;border-radius:14px;background:${chipBg};color:${iconColor};display:flex;align-items:center;justify-content:center;flex-shrink:0"><iconify-icon icon="${icon}" style="font-size:1.7rem"></iconify-icon></div>
    <div style="flex:1;min-width:0"><div style="font-size:1.02rem;font-weight:800;color:var(--text-primary)">${label}</div>${sub?`<div style="font-size:0.8rem;color:var(--text-secondary);margin-top:2px">${sub}</div>`:''}</div>
    <iconify-icon icon="solar:alt-arrow-right-bold" style="font-size:1.3rem;color:var(--text-secondary)"></iconify-icon>
  </button>`;
const sec=(t)=>`<div style="font-size:0.78rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-secondary);margin:14px 0 8px">${t}</div>`;
document.getElementById('p3').innerHTML=`
<div style="font-size:1.35rem;font-weight:900;color:var(--text-primary);margin:4px 0 10px">Autres services</div>
${sec('Mon argent')}
${ligne('solar:history-bold-duotone','#eff6ff','#1e40af','Mes paiements','Payer et voir l’historique')}
${ligne('solar:document-text-bold-duotone','#fee2e2','#b91c1c','Mes amendes','Contraventions et contestations')}
${sec('Ma voiture')}
${ligne('solar:clipboard-check-bold-duotone','#f1f5f9','#334155','État de la voiture','Photos avant de commencer')}
${ligne('solar:wrench-bold-duotone','#f1f5f9','#334155','Entretien','Révisions et réparations')}
${sec('Moi')}
${ligne('solar:cup-star-bold-duotone','#eff6ff','#1e40af','Mon classement','Ma place parmi les chauffeurs')}
${ligne('solar:user-circle-bold-duotone','#eff6ff','#1e40af','Mon profil','Mes informations et mon code')}
${sec('Besoin d’aide ?')}
${ligne('solar:phone-calling-bold-duotone','#ecfdf5','#047857','Appeler le bureau','On vous répond')}
${bnav('plus')}`;
</script></body></html>
